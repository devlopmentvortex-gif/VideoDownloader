name: videodownloader
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  multilingual: ^1.1.7

  # permission dialogs (notif + storage/photos-videos)
  permission_handler: ^11.3.1

  # local persist (language, theme, etc)
  shared_preferences: ^2.3.2

  # internet access — video fetch / download
  http: ^1.2.2
  dio: ^5.7.0

  # video player
  video_player: ^2.8.2

  # save file to device storage after download
  path_provider: ^2.1.4

  # open link / privacy policy url
  url_launcher: ^6.3.0

  # gallery/save downloaded video-image
  gal: ^2.3.0

  # lottie json animations (permission screen etc)
  lottie: ^3.1.3

  # brand svg icons (social platform grid)
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/svgs/